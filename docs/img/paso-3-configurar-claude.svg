<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect width="1000" height="680" fill="#F6F7F3"/>
<circle cx="64" cy="56" r="26" fill="#FFE600"/>
<text x="64" y="66" text-anchor="middle" font-size="28" font-weight="800" fill="#17211C">3</text>
<text x="106" y="66" font-size="26" font-weight="800" fill="#17211C">Agregá el conector a Claude Desktop</text>
<rect x="70" y="100" width="860" height="150" rx="14" fill="#FFFFFF" stroke="#DDE2DB" /><text x="94" y="136" font-size="15.5" font-weight="700" fill="#17211C">Abrí el archivo de configuración de Claude Desktop:</text><text x="94" y="166" font-size="14.5" fill="#17211C">Windows: apretá Win+R y pegá  <tspan font-family="ui-monospace, Consolas, monospace" font-weight="700">%APPDATA%\Claude\claude_desktop_config.json</tspan></text><text x="94" y="194" font-size="14.5" fill="#17211C">Mac: en Claude Desktop → Settings → Developer → Edit Config</text><text x="94" y="224" font-size="14.5" fill="#5C665F">Archivo vacío: pegá el bloque completo. Si ya tiene otros conectores, sumá solo la parte "mercadolibre".</text><rect x="70" y="270" width="860" height="330" rx="14" fill="#17211C"/><text x="100" y="306" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >{</text><text x="100" y="330" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >  &quot;mcpServers&quot;: {</text><text x="100" y="354" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >    &quot;mercadolibre&quot;: {</text><text x="100" y="378" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >      &quot;command&quot;: &quot;npx&quot;,</text><text x="100" y="402" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >      &quot;args&quot;: [&quot;-y&quot;, &quot;github:kokesaurio/mercadolibre-sellers-mcp-algoritmo-Digital&quot;],</text><text x="100" y="426" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >      &quot;env&quot;: {</text><text x="100" y="450" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#FFE600" font-weight="800">        &quot;ML_APP_ID&quot;: &quot;TU_APP_ID&quot;,</text><text x="100" y="474" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#FFE600" font-weight="800">        &quot;ML_APP_SECRET&quot;: &quot;TU_SECRET_KEY&quot;</text><text x="100" y="498" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >      }</text><text x="100" y="522" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >    }</text><text x="100" y="546" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >  }</text><text x="100" y="570" font-size="14.5" font-family="ui-monospace, Consolas, monospace" fill="#C9D3CC" >}</text><text x="770" y="448" text-anchor="start" font-size="14.5" font-weight="700" fill="#E5484D">← reemplazá con</text><text x="770" y="468" text-anchor="start" font-size="14.5" font-weight="700" fill="#E5484D">tus datos del paso 2</text><text x="94" y="636" font-size="15" font-weight="700" fill="#17211C">Guardá el archivo y reiniciá Claude Desktop (cerralo del todo y volvé a abrirlo).</text>
<text x="500" y="664" text-anchor="middle" font-size="13" fill="#5C665F">Guía del conector MCP de MercadoLibre — Algoritmo Digital · algoritmodigital.com.ar</text>
</svg>