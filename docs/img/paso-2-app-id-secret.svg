<text x="64" y="66" text-anchor="middle" font-size="28" font-weight="800" fill="#17211C">2</text>
<text x="106" y="66" font-size="26" font-weight="800" fill="#17211C">Anotá el App ID y el Secret Key</text>
<rect x="70" y="100" width="860" height="250" rx="14" fill="#FFFFFF" stroke="#DDE2DB" /><text x="94" y="140" font-size="16" font-weight="800" fill="#17211C">Tu aplicación quedó creada — anotá estos dos datos:</text><text x="100" y="168" font-size="14" font-weight="700" fill="#5C665F">App ID</text>
<rect x="100" y="176" width="380" height="40" rx="8" fill="#F6F7F3" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="112" y="202" font-size="15" fill="#17211C" font-family="ui-monospace, Consolas, monospace">1234567890123456</text><text x="520" y="168" font-size="14" font-weight="700" fill="#5C665F">Secret Key</text>
<rect x="520" y="176" width="380" height="40" rx="8" fill="#F6F7F3" stroke="#E5484D" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="532" y="202" font-size="15" fill="#17211C" font-family="ui-monospace, Consolas, monospace">••••••••••••••••••••  [Mostrar]</text><text x="100" y="268" font-size="15" fill="#17211C">Van en la configuración de Claude como ML_APP_ID y ML_APP_SECRET.</text><text x="100" y="296" font-size="15" font-weight="700" fill="#E5484D">El Secret es como una contraseña: no lo compartas ni lo subas a ningún lado.</text><rect x="70" y="380" width="860" height="120" rx="14" fill="#FFFFFF" stroke="#DDE2DB" /><text x="94" y="420" font-size="15" font-weight="700" fill="#17211C">¿No tenés Node.js? El conector lo necesita (gratis, 2 minutos):</text><text x="94" y="450" font-size="15" fill="#17211C">Descargalo de nodejs.org (versión LTS), instalalo con "siguiente, siguiente" y listo.</text>
<text x="500" y="544" text-anchor="middle" font-size="13" fill="#5C665F">Guía del conector MCP de MercadoLibre — Algoritmo Digital · algoritmodigital.com.ar</text>
</svg>