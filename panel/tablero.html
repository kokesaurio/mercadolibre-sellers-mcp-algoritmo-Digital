<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parte del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --tiza: #F1F3F6; --hoja: #FFFFFF; --tinta: #17202B; --tinta-2: #4A5563; --filete: #D7DCE3;
    --senal: #2457D6; --verde: #107A57; --ambar: #B86E00; --rojo: #C02A35;
    --verde-suave: #E3F2EC; --ambar-suave: #FBF0DD; --rojo-suave: #F8E3E5; --senal-suave: #E5ECFB;
    --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --texto: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) {
    --tiza: #0F1A1E; --hoja: #15232A; --tinta: #E8EEF0; --tinta-2: #A7B6BC; --filete: #26383F;
    --senal: #7FA3FF; --verde: #4CC79A; --ambar: #F0B04F; --rojo: #FF7A82;
    --verde-suave: #143329; --ambar-suave: #3A2C12; --rojo-suave: #3D1C20; --senal-suave: #1A2A4A; } }
  :root[data-tema="oscuro"] {
    --tiza: #0F1A1E; --hoja: #15232A; --tinta: #E8EEF0; --tinta-2: #A7B6BC; --filete: #26383F;
    --senal: #7FA3FF; --verde: #4CC79A; --ambar: #F0B04F; --rojo: #FF7A82;
    --verde-suave: #143329; --ambar-suave: #3A2C12; --rojo-suave: #3D1C20; --senal-suave: #1A2A4A; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--tiza); color: var(--tinta); font: 400 16px/1.55 var(--texto); }
  .pagina { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
  a { color: var(--senal); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--senal); outline-offset: 2px; border-radius: 4px; }

  /* Cabecera */
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .sello { font: 600 15px/1.2 var(--display); color: var(--tinta-2); }
  .sello strong { color: var(--tinta); font-weight: 800; }
  .acciones { display: flex; gap: 8px; }
  .boton { background: transparent; border: 1px solid var(--filete); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .boton:hover { border-color: var(--tinta-2); }
  .boton.principal { background: var(--senal); border-color: var(--senal); color: #fff; }

  /* La frase */
  .frase { font: 600 clamp(28px, 4.2vw, 50px)/1.12 var(--display); letter-spacing: -0.02em; margin: 34px 0 12px; max-width: 26ch; }
  .frase-pie { color: var(--tinta-2); margin: 0 0 36px; font-size: 15px; }
  @media (prefers-reduced-motion: no-preference) { .frase { animation: entra 700ms cubic-bezier(.2,.7,.2,1) both; } }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Dos columnas */
  .balance { display: grid; grid-template-columns: 1fr 1.25fr; gap: 0; border-top: 2px solid var(--tinta); }
  .columna { padding: 20px 28px 26px 0; }
  .columna + .columna { padding: 20px 0 26px 28px; border-left: 1px solid var(--filete); }
  h2 { font: 800 21px/1.2 var(--display); margin: 0 0 14px; letter-spacing: -0.01em; }
  .lista { list-style: none; margin: 0; padding: 0; }
  .lista li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--filete); }
  .lista li:last-child { border-bottom: 0; }
  .quien { font-size: 19px; line-height: 1.3; }
  .lista .que { font-size: 15px; }
  .lista .por { display: block; color: var(--tinta-2); font-size: 13px; }
  .marca { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .alta .marca { background: var(--rojo); } .media .marca { background: var(--ambar); } .baja .marca { background: var(--tinta-2); }
  .skill { color: var(--senal); font-size: 13px; }
  .vacio { color: var(--tinta-2); font-size: 15px; padding: 8px 0; }

  /* Números */
  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1px solid var(--filete); border-bottom: 1px solid var(--filete); margin: 8px 0 44px; }
  .numero { padding: 18px 18px 16px 0; }
  .numero + .numero { padding-left: 18px; border-left: 1px solid var(--filete); }
  .numero .t { font-size: 13px; color: var(--tinta-2); }
  .numero .v { font: 800 clamp(22px, 2.3vw, 30px)/1.1 var(--display); white-space: nowrap; margin: 4px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .numero .d { font-size: 13px; color: var(--tinta-2); }
  .numero.verde .v { color: var(--verde); } .numero.ambar .v { color: var(--ambar); } .numero.rojo .v { color: var(--rojo); }

  /* Planilla del equipo */
  .bloque { margin: 0 0 44px; }
  .bloque-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .bloque-cab p { margin: 0; color: var(--tinta-2); font-size: 14px; }
  .planilla { width: 100%; border-collapse: collapse; background: var(--hoja); border-radius: 10px; overflow: hidden; }
  .planilla th { text-align: left; font: 600 13px/1.3 var(--texto); color: var(--tinta-2); padding: 10px 14px; border-bottom: 1px solid var(--filete); }
  .planilla td { padding: 0; border-bottom: 1px solid var(--filete); vertical-align: top; }
  .planilla tr:last-child td { border-bottom: 0; }
  .fila-btn { display: grid; grid-template-columns: 210px 120px 1fr 70px; gap: 14px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; cursor: pointer; align-items: start; }
  .fila-btn:hover { background: var(--senal-suave); }
  .persona { display: flex; gap: 10px; align-items: flex-start; }
  .persona .e { font-size: 22px; line-height: 1; }
  .persona b { font: 800 16px/1.2 var(--display); display: block; }
  .persona small { color: var(--tinta-2); font-size: 13px; }
  .estado { font-size: 13px; color: var(--tinta-2); }
  .estado .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--verde); margin-right: 6px; }
  .estado.pausa .punto { background: var(--tinta-2); } .estado.error .punto { background: var(--rojo); }
  .novedad { font-size: 14px; }
  .contador { justify-self: end; font: 800 15px/1 var(--display); color: var(--tinta-2); }
  .contador.hay { color: #fff; background: var(--rojo); border-radius: 999px; padding: 4px 9px; }

  /* Lo que viene + evolución */
  .doble { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; margin-bottom: 44px; }
  .viene li { grid-template-columns: 70px 1fr; }
  .fecha { font: 800 15px/1.3 var(--display); }
  .decision { font-size: 13px; }
  .decision.pendiente { color: var(--ambar); font-weight: 600; } .decision.si { color: var(--verde); } .decision.no { color: var(--tinta-2); }
  .series { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
  .serie .t { font-size: 13px; color: var(--tinta-2); }
  .serie .v { font: 800 20px/1.2 var(--display); font-variant-numeric: tabular-nums; }
  .serie svg { width: 100%; height: 42px; display: block; overflow: visible; }
  .serie path.linea { fill: none; stroke: var(--senal); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .serie path.area { fill: var(--senal-suave); stroke: none; }

  /* Bitácora */
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--filete); background: var(--hoja); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--tinta); color: var(--tiza); border-color: var(--tinta); }
  .bitacora li { grid-template-columns: 30px 1fr 92px; }
  .bitacora li.mas { grid-template-columns: 30px 1fr; border-bottom: 0; }
  .hora { font-size: 13px; color: var(--tinta-2); text-align: right; font-variant-numeric: tabular-nums; }

  /* Panel lateral del trabajador */
  .velo { position: fixed; inset: 0; background: rgba(10, 18, 24, .45); display: none; z-index: 20; }
  .velo.abierto { display: block; }
  .lateral { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--hoja); z-index: 21; transform: translateX(100%); transition: transform 260ms cubic-bezier(.2,.7,.2,1); display: flex; flex-direction: column; border-radius: 14px 0 0 14px; }
  .lateral.abierto { transform: none; }
  @media (prefers-reduced-motion: reduce) { .lateral { transition: none; } }
  .lateral header { padding: 22px 24px 14px; border-bottom: 1px solid var(--filete); }
  .lateral h3 { font: 800 26px/1.15 var(--display); margin: 4px 0 6px; }
  .lateral .oficio { color: var(--tinta-2); font-size: 14px; margin: 0; max-width: 70ch; }
  .lateral .cuerpo { overflow: auto; padding: 16px 24px 28px; }
  .tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabla th { text-align: left; font-weight: 600; color: var(--tinta-2); border-bottom: 1px solid var(--filete); padding: 8px 10px 8px 0; position: sticky; top: 0; background: var(--hoja); }
  .tabla td { border-bottom: 1px solid var(--filete); padding: 8px 10px 8px 0; vertical-align: top; }
  .cerrar { position: absolute; top: 16px; right: 16px; }
  .pedile { background: var(--senal-suave); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 12px 0 0; }

  /* Tutorial */
  .tour-velo { position: fixed; inset: 0; z-index: 40; display: none; }
  .tour-velo.abierto { display: block; }
  .tour-foco { position: absolute; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(10, 18, 24, .62); transition: all 220ms ease; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .tour-foco { transition: none; } }
  .tour-caja { position: absolute; width: min(360px, calc(100vw - 32px)); background: var(--hoja); color: var(--tinta); border-radius: 12px; padding: 16px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .tour-caja h4 { font: 800 19px/1.2 var(--display); margin: 0 0 6px; }
  .tour-caja p { margin: 0 0 14px; font-size: 15px; }
  .tour-pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tour-paso { font-size: 13px; color: var(--tinta-2); }

  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .demo { background: var(--ambar-suave); color: var(--tinta); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 16px; }

  @media (max-width: 860px) {
    .balance { grid-template-columns: 1fr; }
    .columna, .columna + .columna { padding: 18px 0; border-left: 0; }
    .columna + .columna { border-top: 1px solid var(--filete); }
    .doble { grid-template-columns: 1fr; }
    .fila-btn { grid-template-columns: 1fr auto; }
    .fila-btn .estado, .fila-btn .novedad { grid-column: 1 / -1; }
    .numero + .numero { border-left: 0; padding-left: 0; }
    .numero { border-bottom: 1px solid var(--filete); }
    .pagina { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <div class="cabecera">
    <div class="sello" id="sello"></div>
    <div class="acciones">
      <button class="boton" id="btn-tema" type="button">Cambiar tema</button>
      <button class="boton principal" id="btn-tour" type="button">Ver tutorial</button>
    </div>
  </div>
  <div id="aviso-demo"></div>
  <p class="frase" id="frase" data-tour="frase"></p>
  <p class="frase-pie" id="frase-pie"></p>

  <section class="balance" aria-label="Balance del día">
    <div class="columna" data-tour="funciona">
      <h2>Lo que está funcionando</h2>
      <ul class="lista" id="funciona"></ul>
    </div>
    <div class="columna" data-tour="atencion">
      <h2>Lo que necesita atención</h2>
      <ul class="lista" id="atencion"></ul>
    </div>
  </section>

  <section class="numeros" id="numeros" aria-label="Números" data-tour="numeros"></section>

  <section class="bloque" data-tour="equipo">
    <div class="bloque-cab"><h2>Tu equipo de turno</h2><p id="equipo-pie"></p></div>
    <table class="planilla">
      <thead class="oculto"><tr><th scope="col">Trabajador, estado, última novedad y alertas sin leer</th></tr></thead>
      <tbody id="equipo"></tbody>
    </table>
  </section>

  <div class="doble">
    <section data-tour="viene">
      <h2>Lo que viene</h2>
      <ul class="lista viene" id="viene"></ul>
    </section>
    <section data-tour="evolucion">
      <h2>Evolución de 30 días</h2>
      <div class="series" id="series"></div>
    </section>
  </div>

  <section class="bloque" data-tour="bitacora">
    <div class="bloque-cab"><h2>Bitácora de la semana</h2><p>Todo lo que avisaron, lo más nuevo primero.</p></div>
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar la bitácora"></div>
    <ul class="lista bitacora" id="bitacora"></ul>
  </section>
</div>

<div class="velo" id="velo"></div>
<aside class="lateral" id="lateral" role="dialog" aria-modal="true" aria-labelledby="lat-nombre" hidden>
  <button class="boton cerrar" id="lat-cerrar" type="button">Cerrar</button>
  <header>
    <div class="persona"><span class="e" id="lat-emoji"></span><div><small id="lat-puesto"></small></div></div>
    <h3 id="lat-nombre"></h3>
    <p class="oficio" id="lat-oficio"></p>
    <p class="pedile" id="lat-pedile"></p>
  </header>
  <div class="cuerpo" id="lat-cuerpo"></div>
</aside>

<div class="tour-velo" id="tour" role="dialog" aria-modal="true" aria-labelledby="tour-titulo">
  <div class="tour-foco" id="tour-foco"></div>
  <div class="tour-caja" id="tour-caja">
    <h4 id="tour-titulo"></h4>
    <p id="tour-texto"></p>
    <div class="tour-pie">
      <span class="tour-paso" id="tour-paso"></span>
      <span>
        <button class="boton" id="tour-saltar" type="button">Saltar</button>
        <button class="boton" id="tour-atras" type="button">Anterior</button>
        <button class="boton principal" id="tour-sig" type="button">Siguiente</button>
      </span>
    </div>
  </div>
</div>

<script id="datos" type="application/json">/*__DATOS_DEL_TABLERO__*/null</script>
<script>
(function () {
  'use strict';
  // ───────── Datos (o demo si se abre la plantilla sola) ─────────
  var bruto = document.getElementById('datos').textContent.trim();
  var D = null;
  try { D = bruto.indexOf('/*') === 0 ? null : JSON.parse(bruto); } catch (e) { D = null; }
  var esDemo = !D;
  if (esDemo) D = demo();

  // ───────── Utilidades seguras: todo texto entra por textContent ─────────
  function h(tag, attrs, hijos) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'texto') el.textContent = attrs[k];
      else if (k === 'clase') el.className = attrs[k];
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    }
    (hijos || []).forEach(function (c) { if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function $(id) { return document.getElementById(id); }
  function vaciar(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function cuando(t) {
    if (!t) return 'todavía no';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'recién'; if (m < 60) return 'hace ' + m + ' min'; if (m < 1440) return 'hace ' + Math.round(m / 60) + ' h';
    return 'hace ' + Math.round(m / 1440) + ' días';
  }
  function dia(t) { return new Date(t).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }); }
  function guardado(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var porId = {}; D.equipo.forEach(function (w) { porId[w.id] = w; });

  // ───────── Cabecera y frase ─────────
  $('sello').appendChild(h('span', null, [h('strong', { texto: 'Parte del día' }), ' de ' + (D.tiendas.length ? D.tiendas.join(' y ') : 'tu tienda')]));
  if (esDemo) $('aviso-demo').appendChild(h('div', { clase: 'demo', texto: 'Estás viendo datos de ejemplo. Pedile a Claude "abrí el tablero" y se arma con los datos de tu tienda.' }));
  $('frase').textContent = D.frase;
  $('frase-pie').textContent = 'Actualizado ' + cuando(D.generado) + (D.corriendo ? '. El equipo está trabajando ' + (D.corriendo === 'servicio' ? 'las 24 horas.' : 'mientras Claude está abierto.') : '. El equipo trabaja cuando Claude está abierto.');

  // ───────── Funciona / atención ─────────
  function itemLista(x, conNivel) {
    var que = h('div', { clase: 'que' }, [conNivel ? h('span', { clase: 'marca', 'aria-hidden': 'true' }) : null, x.texto,
      h('span', { clase: 'por' }, [x.nombre + (x.skill ? '. ' : ''), x.skill ? h('span', { clase: 'skill', texto: 'Pedile a Claude la skill ' + x.skill }) : null])]);
    return h('li', { clase: conNivel ? x.nivel : '' }, [h('span', { clase: 'quien', 'aria-hidden': 'true', texto: x.emoji }), que]);
  }
  if (D.funciona.length) D.funciona.forEach(function (x) { $('funciona').appendChild(itemLista(x, false)); });
  else $('funciona').appendChild(h('li', { clase: 'vacio' }, [h('span'), h('span', { texto: 'Cuando el equipo junte datos, acá van tus productos, campañas y búsquedas que mejor andan.' })]));
  if (D.atencion.length) D.atencion.forEach(function (x) { $('atencion').appendChild(itemLista(x, true)); });
  else $('atencion').appendChild(h('li', { clase: 'vacio' }, [h('span', { texto: '✅' }), h('span', { texto: 'Nada pendiente. Tu equipo sigue vigilando.' })]));

  // ───────── Números ─────────
  D.numeros.forEach(function (n) {
    $('numeros').appendChild(h('div', { clase: 'numero ' + (n.tono || '') }, [h('div', { clase: 't', texto: n.titulo }), h('div', { clase: 'v', texto: n.valor }), h('div', { clase: 'd', texto: n.detalle || '' })]));
  });

  // ───────── Equipo ─────────
  var activos = D.equipo.filter(function (w) { return w.activo; }).length;
  $('equipo-pie').textContent = activos + ' de ' + D.equipo.length + ' trabajando. Tocá a cualquiera para ver todo lo que sabe.';
  D.equipo.forEach(function (w) {
    var est = w.error ? 'error' : w.activo ? '' : 'pausa';
    var btn = h('button', { clase: 'fila-btn', type: 'button', 'aria-label': w.nombre + ', ' + w.puesto + '. Ver detalle', onclick: function () { abrirTrabajador(w.id, btn); } }, [
      h('span', { clase: 'persona' }, [h('span', { clase: 'e', 'aria-hidden': 'true', texto: w.emoji }), h('span', null, [h('b', { texto: w.nombre }), h('small', { texto: w.puesto + ', ' + w.cada })])]),
      h('span', { clase: 'estado ' + est }, [h('span', { clase: 'punto', 'aria-hidden': 'true' }), w.error ? 'con un error' : w.activo ? cuando(w.ultimo) : 'en pausa']),
      h('span', { clase: 'novedad', texto: w.destacado || 'Sin novedades.' }),
      h('span', { clase: 'contador' + (w.sinLeer ? ' hay' : ''), texto: w.sinLeer ? String(w.sinLeer) : '0', 'aria-label': w.sinLeer + ' alertas sin leer' })]);
    $('equipo').appendChild(h('tr', null, [h('td', null, [btn])]));
  });

  // ───────── Lo que viene ─────────
  var DEC = { pendiente: 'Falta que decidas si participás', si: 'Participás', no: 'No participás' };
  if (D.viene.length) D.viene.forEach(function (v) {
    $('viene').appendChild(h('li', null, [h('span', { clase: 'fecha', texto: dia(v.t) }), h('div', { clase: 'que' }, [v.nombre, h('span', { clase: 'por', texto: v.tipo + (v.cierre ? ', inscripción hasta el ' + dia(v.cierre) : '') }), h('span', { clase: 'decision ' + v.decision, texto: DEC[v.decision] || '' })])]));
  });
  else $('viene').appendChild(h('li', { clase: 'vacio' }, [h('span'), h('span', { texto: 'Clara todavía no armó la agenda. Pedile a Claude "¿qué fechas vienen?".' })]));

  // ───────── Evolución ─────────
  var SERIES = [['facturacion', 'Facturación del mes', true], ['neto', 'Neto del mes', true], ['ganancia', 'Ganancia de 30 días', true], ['publicidad', 'Publicidad de 7 días', true], ['preguntas', 'Preguntas sin responder', false], ['sinStock', 'Productos sin stock', false]];
  var NS = 'http://www.w3.org/2000/svg';
  SERIES.forEach(function (s) {
